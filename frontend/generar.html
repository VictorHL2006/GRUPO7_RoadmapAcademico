<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generar Roadmap · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container py-4"><div id="aviso" class="alert d-none"></div><section class="card shadow-sm mb-3"><div class="card-body"><h1 class="h4">Generar Roadmap Académico</h1><p>Calcula una carga de cursos y guarda el documento PDF firmado.</p><label class="form-label" for="creditos">Máximo de créditos</label><input id="creditos" type="number" class="form-control" min="1" max="40" value="22" style="max-width:220px"><button id="generar" class="btn btn-primary mt-3">Generar Roadmap</button></div></section><section id="resultado" class="card shadow-sm d-none"><div class="card-body"><h2 class="h5">Especialidad sugerida: <span id="especialidad"></span></h2><p>Créditos asignados: <strong id="totalCreditos"></strong></p><h3 class="h6">Cursos recomendados</h3><ul id="listaCursos"></ul><a id="verDoc" class="btn btn-outline-primary" target="_blank">Ver documento</a> <button id="descargarPdf" class="btn btn-success" type="button">Descargar PDF</button></div></section></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>
cargarMenu('generar.html');async function descargar(id){const response=await fetch(API+'/roadmaps/'+encodeURIComponent(id)+'/pdf',{headers:{Authorization:'Bearer '+token()}});if(!response.ok){const err=await response.json().catch(()=>({detail:'No se pudo descargar el PDF'}));throw new Error(err.detail||'No se pudo descargar el PDF')}const a=document.createElement('a');a.href=URL.createObjectURL(await response.blob());a.download='roadmap_'+id+'.pdf';a.click();URL.revokeObjectURL(a.href)}document.getElementById('generar').addEventListener('click',async()=>{const aviso=document.getElementById('aviso'),button=document.getElementById('generar');aviso.className='alert d-none';button.disabled=true;button.textContent='Generando…';try{const r=await api('/roadmap/generar?max_creditos='+encodeURIComponent(document.getElementById('creditos').value),{method:'POST'});document.getElementById('especialidad').textContent=r.especialidad;document.getElementById('totalCreditos').textContent=r.creditos;const list=document.getElementById('listaCursos');list.replaceChildren(...r.cursos.map(c=>{const li=document.createElement('li');li.textContent=c;return li}));document.getElementById('verDoc').href='visor.html?id='+encodeURIComponent(r.id);document.getElementById('descargarPdf').onclick=()=>descargar(r.id);document.getElementById('resultado').classList.remove('d-none')}catch(e){aviso.textContent=e.message;aviso.className='alert alert-danger'}finally{button.disabled=false;button.textContent='Generar Roadmap'}})
</script></body></html>
