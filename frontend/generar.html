<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar Roadmap · Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>
  <main class="container py-4">
    <div id="aviso" class="alert d-none" role="status" aria-live="polite"></div>
    <section class="card shadow-sm mb-3">
      <div class="card-body">
        <h1 class="h4">Generar Roadmap Académico</h1>
        <p>Primero revisa la recomendación. Después emite el PDF firmado con su código QR.</p>
        <label class="form-label" for="creditos">Máximo de créditos</label>
        <input id="creditos" type="number" class="form-control" min="1" max="40" value="22" style="max-width:220px">
        <button id="recomendar" class="btn btn-primary mt-3" type="button">Calcular recomendación</button>
      </div>
    </section>

    <section id="resultado" class="card shadow-sm d-none">
      <div class="card-body">
        <h2 class="h5">Especialidad sugerida: <span id="especialidad"></span></h2>
        <p>Créditos asignados: <strong id="totalCreditos"></strong></p>
        <h3 class="h6">Cursos recomendados</h3>
        <ul id="listaCursos"></ul>
        <button id="emitir" class="btn btn-success" type="button" disabled>Emitir PDF firmado</button>
      </div>
    </section>

    <section id="emitido" class="card shadow-sm mt-3 d-none" aria-live="polite">
      <div class="card-body">
        <h2 class="h5">Roadmap emitido</h2>
        <p id="codigo"></p>
        <a id="verDocumento" class="btn btn-outline-primary me-2">Abrir PDF</a>
        <a id="verificarDocumento" class="btn btn-outline-success">Verificar código</a>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
  <script>
    cargarMenu('generar.html')
    const notice = document.getElementById('aviso')
    const recommendButton = document.getElementById('recomendar')
    const emitButton = document.getElementById('emitir')
    const resultSection = document.getElementById('resultado')
    const issuedSection = document.getElementById('emitido')
    let recommendationReady = false

    function showError(error) {
      notice.textContent = error.message
      notice.className = 'alert alert-danger'
    }

    function creditQuery() {
      return '?max_creditos=' + encodeURIComponent(document.getElementById('creditos').value)
    }

    recommendButton.addEventListener('click', async () => {
      notice.className = 'alert d-none'
      issuedSection.classList.add('d-none')
      recommendationReady = false
      emitButton.disabled = true
      recommendButton.disabled = true
      recommendButton.textContent = 'Calculando…'
      try {
        const plan = await api('/roadmaps/recomendar' + creditQuery(), { method: 'POST' })
        document.getElementById('especialidad').textContent = plan.especialidad
        document.getElementById('totalCreditos').textContent = plan.creditos
        const list = document.getElementById('listaCursos')
        list.replaceChildren(...plan.cursos.map((course) => {
          const item = document.createElement('li')
          item.textContent = course
          return item
        }))
        resultSection.classList.remove('d-none')
        recommendationReady = true
        emitButton.disabled = false
      } catch (error) {
        showError(error)
      } finally {
        recommendButton.disabled = false
        recommendButton.textContent = 'Calcular recomendación'
      }
    })

    emitButton.addEventListener('click', async () => {
      if (!recommendationReady) return
      notice.className = 'alert d-none'
      emitButton.disabled = true
      emitButton.textContent = 'Emitiendo…'
      try {
        const documentInfo = await api('/roadmaps/emitir' + creditQuery(), { method: 'POST' })
        const code = documentInfo.codigo_verificacion || documentInfo.codigo
        document.getElementById('codigo').textContent = 'Código de verificación: ' + code
        document.getElementById('verDocumento').href = 'visor.html?id=' + encodeURIComponent(documentInfo.id)
        document.getElementById('verificarDocumento').href = 'verificar.html?codigo=' + encodeURIComponent(code)
        issuedSection.classList.remove('d-none')
      } catch (error) {
        showError(error)
        emitButton.disabled = false
      } finally {
        emitButton.textContent = 'Emitir PDF firmado'
      }
    })

    document.getElementById('creditos').addEventListener('input', () => {
      recommendationReady = false
      emitButton.disabled = true
      issuedSection.classList.add('d-none')
    })
  </script>
</body>
</html>
