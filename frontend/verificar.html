<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:850px"><header class="mb-4"><h1 class="h2">Portal de verificación</h1><p class="text-muted">Comprueba la firma digital y la integridad de un Roadmap Académico.</p></header><div id="aviso" class="alert d-none" role="alert"></div><section id="formulario" class="card shadow-sm"><div class="card-body"><h2 class="h5">Verificación manual</h2><p>Sube el PDF y su archivo de firma (.sig).</p><form id="form"><label class="form-label" for="documento">Documento PDF</label><input class="form-control mb-3" id="documento" type="file" accept="application/pdf,.pdf" required><label class="form-label" for="firma">Firma digital (.sig)</label><input class="form-control mb-3" id="firma" type="file" accept=".sig,application/octet-stream" required><button class="btn btn-primary">Verificar documento</button></form></div></section><section id="resultado" class="card shadow-sm d-none mt-3"><div class="card-body"><h2 id="titulo" class="h4"></h2><p id="detalle"></p><dl id="metadatos" class="d-none"><dt>Código de estudiante</dt><dd id="estudiante"></dd><dt>Fecha de emisión</dt><dd id="emitido"></dd><dt>Hash SHA-256</dt><dd id="hash" class="font-monospace text-break"></dd></dl><button id="otro" class="btn btn-outline-primary">Verificar otro documento</button></div></section><p class="mt-4"><a href="login.html">Iniciar sesión</a></p></main><script src="js/api.js"></script><script>
const alertBox=document.getElementById('aviso'),resultBox=document.getElementById('resultado');function showError(e){alertBox.textContent=e.message||String(e);alertBox.className='alert alert-danger'}function showResult(r){alertBox.className='alert d-none';document.getElementById('formulario').classList.add('d-none');resultBox.classList.remove('d-none');const ok=r.resultado==='auténtico';const title=document.getElementById('titulo');title.textContent=ok?'Documento auténtico':'Documento alterado';title.className='h4 '+(ok?'text-success':'text-danger');document.getElementById('detalle').textContent=ok?'La firma digital coincide con el archivo.':'La firma no coincide o el archivo fue modificado. Solicita el documento original.';if(r.estudiante){document.getElementById('metadatos').classList.remove('d-none');document.getElementById('estudiante').textContent=r.estudiante;document.getElementById('emitido').textContent=new Date(r.emitido).toLocaleString('es-PE');document.getElementById('hash').textContent=r.hash||''}}
const id=new URLSearchParams(location.search).get('id');if(id){api('/verificar/'+encodeURIComponent(id)).then(showResult).catch(showError)}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();alertBox.className='alert d-none';const data=new FormData();data.append('documento',document.getElementById('documento').files[0]);data.append('firma',document.getElementById('firma').files[0]);try{showResult(await api('/verificar',{method:'POST',body:data}))}catch(err){showError(err)}});document.getElementById('otro').addEventListener('click',()=>location.href='verificar.html')
</script></body></html>
