<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel - Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>
  <main class="rm-contenedor">
    <div id="aviso" class="alert alert-warning d-none" role="alert"></div>
    <section class="rm-tarjeta mb-4" aria-label="Resumen académico">
      <h4 class="mb-3">Hola, <span id="nombre">estudiante</span></h4>
      <div class="row text-center">
        <div class="col-6"><div class="rm-numero" id="aprobados">-</div><div class="text-muted">Cursos aprobados</div></div>
        <div class="col-6"><div class="rm-numero" id="creditos">-</div><div class="text-muted">Créditos acumulados</div></div>
      </div>
    </section>
    <div class="row g-3">
      <div class="col-md-6 col-lg-3"><a class="rm-tarjeta rm-acceso" href="perfil.html"><h5>Perfil</h5><p class="mb-0 text-muted">Datos personales e historial de cursos.</p></a></div>
      <div class="col-md-6 col-lg-3"><a class="rm-tarjeta rm-acceso" href="intereses.html"><h5>Intereses</h5><p class="mb-0 text-muted">Elige las áreas que te interesan.</p></a></div>
      <div class="col-md-6 col-lg-3"><a class="rm-tarjeta rm-acceso" href="generar.html"><h5>Generar Roadmap</h5><p class="mb-0 text-muted">Obtén tu recomendación firmada.</p></a></div>
      <div class="col-md-6 col-lg-3"><a class="rm-tarjeta rm-acceso" href="roadmaps.html"><h5>Mis Roadmaps</h5><p class="mb-0 text-muted">Consulta los documentos emitidos.</p></a></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
  <script>
    exigirSesion("estudiante");
    cargarMenu("panel.html");
    // Si GET /perfil aún no responde se muestran valores de ejemplo (declararlo en la ficha; poner false al integrar).
    const USAR_EJEMPLO_SI_FALLA = true;
    async function cargar() {
      try {
        const p = await api("/perfil");
        nombre.textContent = p.nombres;
        aprobados.textContent = p.cursos_aprobados;
        creditos.textContent = p.creditos_acumulados;
      } catch (e) {
        if (!USAR_EJEMPLO_SI_FALLA) return;
        nombre.textContent = "Estudiante demo";
        aprobados.textContent = "12";
        creditos.textContent = "34";
        aviso.textContent = "Datos de ejemplo: el endpoint /perfil aún no responde.";
        aviso.classList.remove("d-none");
      }
    }
    cargar();
  </script>
</body>
</html>
