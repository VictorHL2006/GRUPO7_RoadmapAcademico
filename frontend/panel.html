<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container py-4"><div id="aviso" class="alert alert-warning d-none"></div><h1 class="h3 mb-3">Panel principal</h1><section class="card shadow-sm mb-4"><div class="card-body"><h2 class="h5">Hola, <span id="nombre">estudiante</span></h2><p>Cursos aprobados: <strong id="aprobados">-</strong> · Créditos acumulados: <strong id="creditos">-</strong></p></div></section><div class="row g-3"><div class="col-md-3"><a class="card card-body h-100" href="perfil.html">Perfil e historial</a></div><div class="col-md-3"><a class="card card-body h-100" href="intereses.html">Intereses profesionales</a></div><div class="col-md-3"><a class="card card-body h-100" href="generar.html">Generar Roadmap</a></div><div class="col-md-3"><a class="card card-body h-100" href="roadmaps.html">Mis Roadmaps</a></div></div></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>cargarMenu('panel.html');api('/perfil').then(p=>{nombre.textContent=p.nombres;aprobados.textContent=p.cursos_aprobados;creditos.textContent=p.creditos??'No disponible'}).catch(e=>{aviso.textContent=e.message;aviso.classList.remove('d-none')})</script></body></html>
