<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <main class="rm-login">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3 text-center">Roadmap Académico</h4>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <input id="correo" class="form-control mb-2" type="email" placeholder="Correo" aria-label="Correo" autocomplete="username">
      <input id="clave" class="form-control mb-3" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
      <button class="btn btn-primary w-100" onclick="ingresar()">Ingresar</button>
      <a href="registro.html" class="d-block text-center mt-3">Crear cuenta</a>
    </div></div>
  </main>
  <script src="js/api.js"></script>
  <script>
    async function ingresar() {
      error.classList.add("d-none");
      try {
        const r = await api("/auth/login", { method: "POST",
          body: { correo: correo.value, clave: clave.value } });
        sessionStorage.setItem("token", r.token);
        sessionStorage.setItem("rol", r.rol);
        location.href = r.rol === "tutor" ? "tutor.html" : "panel.html";
      } catch (e) {
        error.textContent = e.message === "Failed to fetch"
          ? "No se pudo conectar con el servidor. Verifica que el backend esté en el puerto 8000."
          : e.message;
        error.classList.remove("d-none");
      }
    }
    document.addEventListener("keydown", function (e) { if (e.key === "Enter") ingresar(); });
  </script>
</body>
</html>
