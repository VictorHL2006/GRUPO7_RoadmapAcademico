<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 460px">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-4">Roadmap Académico</h1>
        <div id="error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
        <form id="login-form">
          <label class="form-label" for="correo">Correo</label>
          <input id="correo" name="correo" class="form-control mb-3" type="email" autocomplete="username" required>
          <label class="form-label" for="clave">Contraseña</label>
          <input id="clave" name="clave" class="form-control mb-3" type="password" autocomplete="current-password" required>
          <button id="ingresar" class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
        <a href="registro.html" class="d-block text-center mt-3">Crear cuenta</a>
      </div>
    </div>
  </main>
  <script src="js/api.js?v=login-fix-20261018"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form')
      const correo = document.getElementById('correo')
      const clave = document.getElementById('clave')
      const error = document.getElementById('error')
      const boton = document.getElementById('ingresar')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        error.textContent = ''
        error.classList.add('d-none')
        boton.disabled = true
        boton.textContent = 'Ingresando…'

        try {
          const resultado = await api('/auth/login', {
            method: 'POST',
            body: { correo: correo.value.trim(), clave: clave.value }
          })
          sessionStorage.setItem('token', resultado.token)
          sessionStorage.setItem('rol', resultado.rol)
          window.location.assign(resultado.rol === 'tutor' ? 'tutor.html' : 'panel.html')
        } catch (err) {
          error.textContent = err && err.message
            ? err.message
            : 'No se pudo iniciar sesión. Comprueba los datos y que el backend esté activo.'
          error.classList.remove('d-none')
          boton.disabled = false
          boton.textContent = 'Ingresar'
        }
      })
    })
  </script>
</body>
</html>
