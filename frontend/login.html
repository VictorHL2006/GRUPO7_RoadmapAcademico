<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Roadmap Académico"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="estilos.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:460px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 text-center mb-4">Roadmap Académico</h1><div id="error" class="alert alert-danger d-none"></div><form id="form"><label class="form-label" for="correo">Correo</label><input id="correo" class="form-control mb-3" type="email" autocomplete="username" required><label class="form-label" for="clave">Contraseña</label><input id="clave" class="form-control mb-3" type="password" autocomplete="current-password" required><button class="btn btn-primary w-100">Ingresar</button></form><a href="registro.html" class="d-block text-center mt-3">Crear cuenta</a></div></div></main><script src="js/api.js"></script><script>
form.addEventListener('submit', async e => { e.preventDefault(); error.classList.add('d-none'); try { const r=await api('/auth/login',{method:'POST',body:{correo:correo.value,clave:clave.value}});sessionStorage.setItem('token',r.token);sessionStorage.setItem('rol',r.rol);location.href=r.rol==='tutor'?'tutor.html':'panel.html' } catch(e){error.textContent=e.message;error.classList.remove('d-none')} })
</script></body></html>
