<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <main class="rm-login">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3 text-center">Crear cuenta de estudiante</h4>
      <div id="mensaje" class="alert d-none" role="alert"></div>
      <input id="codigo" class="form-control mb-2" placeholder="Código de estudiante" aria-label="Código">
      <input id="nombres" class="form-control mb-2" placeholder="Nombres y apellidos" aria-label="Nombres">
      <input id="correo" class="form-control mb-2" type="email" placeholder="Correo" aria-label="Correo">
      <input id="clave" class="form-control mb-2" type="password" placeholder="Contraseña (mínimo 8 caracteres)" aria-label="Contraseña" autocomplete="new-password">
      <input id="clave2" class="form-control mb-3" type="password" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" autocomplete="new-password">
      <button class="btn btn-primary w-100" onclick="registrar()">Registrar</button>
      <a href="login.html" class="d-block text-center mt-3">Volver a iniciar sesión</a>
    </div></div>
  </main>
  <script src="js/api.js"></script>
  <script>
    function aviso(texto, tipo) { mensaje.className = "alert alert-" + tipo; mensaje.textContent = texto; }
    async function registrar() {
      if (!codigo.value.trim() || !nombres.value.trim() || !correo.value.trim() || !clave.value) {
        return aviso("Completa todos los campos.", "danger");
      }
      if (clave.value.length < 8) return aviso("La contraseña debe tener al menos 8 caracteres.", "danger");
      if (clave.value !== clave2.value) return aviso("Las contraseñas no coinciden.", "danger");
      try {
        await api("/auth/registro", { method: "POST", body: {
          codigo: codigo.value.trim(), nombres: nombres.value.trim(),
          correo: correo.value.trim(), clave: clave.value } });
        aviso("Cuenta creada. Te llevamos al inicio de sesión…", "success");
        setTimeout(function () { location.href = "login.html"; }, 1500);
      } catch (e) {
        aviso(e.message === "Failed to fetch" ? "No se pudo conectar con el servidor." : e.message, "danger");
      }
    }
  </script>
</body>
</html>
