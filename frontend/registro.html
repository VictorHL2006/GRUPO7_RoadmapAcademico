<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="estilos.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:560px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Crear cuenta de estudiante</h1><div id="aviso" class="alert d-none"></div><form id="form"><label class="form-label" for="codigo">Código</label><input id="codigo" class="form-control mb-2" required><label class="form-label" for="nombres">Nombres</label><input id="nombres" class="form-control mb-2" required><label class="form-label" for="correo">Correo</label><input id="correo" type="email" class="form-control mb-2" required><label class="form-label" for="clave">Contraseña</label><input id="clave" type="password" minlength="8" class="form-control mb-2" required><label class="form-label" for="clave2">Confirmar contraseña</label><input id="clave2" type="password" minlength="8" class="form-control mb-3" required><button class="btn btn-primary w-100">Registrar</button></form><a href="login.html" class="d-block text-center mt-3">Volver al inicio de sesión</a></div></div></main><script src="js/api.js"></script><script>
form.addEventListener('submit',async e=>{e.preventDefault();aviso.className='alert d-none';if(clave.value!==clave2.value){aviso.textContent='Las contraseñas no coinciden';aviso.className='alert alert-danger';return}try{await api('/auth/registro',{method:'POST',body:{codigo:codigo.value,nombres:nombres.value,correo:correo.value,clave:clave.value}});aviso.textContent='Cuenta creada. Ya puedes iniciar sesión.';aviso.className='alert alert-success';form.reset()}catch(e){aviso.textContent=e.message;aviso.className='alert alert-danger'}})
</script></body></html>
