<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Roadmaps · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container py-4"><div id="aviso" class="alert alert-danger d-none"></div><section class="card shadow-sm"><div class="card-body"><h1 class="h4">Mis Roadmaps emitidos</h1><div class="row g-2 mb-3"><div class="col-md-4"><select id="fEsp" class="form-select"><option value="">Todas las especialidades</option></select></div><div class="col-md-4"><input id="fDesde" type="date" class="form-control"></div><div class="col-md-4"><input id="fHasta" type="date" class="form-control"></div></div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Fecha</th><th>Especialidad</th><th>Créditos</th><th>Acciones</th></tr></thead><tbody id="tabla"></tbody></table></div></div></section></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>
cargarMenu('roadmaps.html');let lista=[];const table=document.getElementById('tabla'),notice=document.getElementById('aviso'),specialty=document.getElementById('fEsp'),from=document.getElementById('fDesde'),to=document.getElementById('fHasta');async function file(id,kind){const response=await fetch(API+'/roadmaps/'+encodeURIComponent(id)+'/'+kind,{headers:{Authorization:'Bearer '+token()}});if(!response.ok)throw new Error('No se pudo descargar el archivo');const a=document.createElement('a');a.href=URL.createObjectURL(await response.blob());a.download='roadmap_'+id+(kind==='pdf'?'.pdf':'.sig');a.click();URL.revokeObjectURL(a.href)}function paint(){const shown=lista.filter(r=>(!specialty.value||r.especialidad===specialty.value)&&(!from.value||r.fecha>=from.value)&&(!to.value||r.fecha<=to.value));table.replaceChildren();for(const r of shown){const tr=document.createElement('tr');for(const v of [r.fecha,r.especialidad,r.creditos]){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}const td=document.createElement('td'),view=document.createElement('a');view.className='btn btn-outline-primary btn-sm me-1';view.href='visor.html?id='+encodeURIComponent(r.id);view.textContent='Ver';td.append(view);for(const kind of ['pdf','firma']){const button=document.createElement('button');button.className='btn btn-sm '+(kind==='pdf'?'btn-primary me-1':'btn-outline-secondary');button.textContent=kind==='pdf'?'PDF':'Firma';button.onclick=()=>file(r.id,kind).catch(e=>{notice.textContent=e.message;notice.classList.remove('d-none')});td.append(button)}tr.append(td);table.append(tr)}if(!shown.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='text-center text-muted';td.textContent='No hay roadmaps con esos filtros';tr.append(td);table.append(tr)}}specialty.addEventListener('change',paint);from.addEventListener('change',paint);to.addEventListener('change',paint);api('/roadmaps').then(data=>{lista=data;for(const e of [...new Set(lista.map(r=>r.especialidad).filter(Boolean))])specialty.add(new Option(e,e));paint()}).catch(e=>{notice.textContent=e.message;notice.classList.remove('d-none')})
</script></body></html>
