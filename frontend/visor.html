<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container-fluid py-4"><div id="aviso" class="alert alert-danger d-none"></div><div class="row g-3"><section class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-2"><iframe id="visor" style="width:100%;height:80vh;border:0" title="Roadmap en PDF"></iframe></div></div></section><aside class="col-lg-4"><div class="card shadow-sm"><div class="card-body"><h1 class="h5">Evidencia de firma</h1><p class="mb-1"><strong>Fecha de emisión</strong></p><p id="fecha">-</p><p class="mb-1"><strong>Estado de la firma</strong></p><p id="estado"><span class="badge bg-secondary">Comprobando…</span></p><p class="mb-1"><strong>Hash SHA-256</strong></p><p id="hash" class="small text-break font-monospace">-</p><p class="mb-1"><strong>Enlace de verificación</strong></p><p class="small text-break"><a id="enlace" href="#">-</a></p><div class="d-grid gap-2"><button class="btn btn-primary" id="pdf">Descargar PDF</button><button class="btn btn-outline-primary" id="firma">Descargar firma (.sig)</button><button class="btn btn-outline-secondary" id="copiar">Copiar enlace</button><a id="verificar" class="btn btn-success" href="#">Ir al portal de verificación</a></div></div></div></aside></div></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>
cargarMenu('roadmaps.html');const id=new URLSearchParams(location.search).get('id'),notice=document.getElementById('aviso'),verificationUrl=location.origin+'/verificar.html?id='+encodeURIComponent(id);let pdfUrl=null;function showError(message){notice.textContent=message;notice.classList.remove('d-none')}async function download(kind){const response=await fetch(API+'/roadmaps/'+encodeURIComponent(id)+'/'+kind,{headers:{Authorization:'Bearer '+token()}});if(!response.ok)throw new Error('No se pudo descargar el archivo');const a=document.createElement('a');a.href=URL.createObjectURL(await response.blob());a.download='roadmap_'+id+(kind==='pdf'?'.pdf':'.sig');a.click();URL.revokeObjectURL(a.href)}async function load(){if(!id){showError('Falta el identificador del roadmap.');return}try{const response=await fetch(API+'/roadmaps/'+encodeURIComponent(id)+'/pdf',{headers:{Authorization:'Bearer '+token()}});if(response.status===401){salir();return}if(!response.ok)throw new Error('No se encontró el PDF emitido.');pdfUrl=URL.createObjectURL(await response.blob());document.getElementById('visor').src=pdfUrl;const items=await api('/roadmaps'),meta=items.find(x=>String(x.id)===id);if(meta){document.getElementById('fecha').textContent=meta.fecha;document.getElementById('hash').textContent=meta.hash||'-'}const a=document.getElementById('enlace');a.href=verificationUrl;a.textContent=verificationUrl;document.getElementById('verificar').href=verificationUrl;try{const v=await api('/verificar/'+encodeURIComponent(id));const state=document.getElementById('estado');state.innerHTML=v.resultado==='auténtico'?'<span class="badge bg-success">Firma válida</span>':'<span class="badge bg-danger">Documento alterado</span>'}catch(e){document.getElementById('estado').textContent='No se pudo verificar: '+e.message}}catch(e){showError(e.message)}}document.getElementById('pdf').addEventListener('click',()=>download('pdf').catch(e=>showError(e.message)));document.getElementById('firma').addEventListener('click',()=>download('firma').catch(e=>showError(e.message)));document.getElementById('copiar').addEventListener('click',()=>navigator.clipboard.writeText(verificationUrl));load()
</script></body></html>
