<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor - Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>
  <div class="container-fluid py-4">
    <div id="aviso" class="alert alert-danger d-none"></div>
    <div class="row g-3">
      <div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-2">
        <iframe id="visor" style="width:100%;height:80vh;border:0" title="Documento PDF"></iframe>
      </div></div></div>
      <div class="col-lg-4"><div class="card shadow-sm"><div class="card-body">
        <h5>Evidencia de firma</h5>
        <p class="mb-1"><b>Fecha de emisión</b></p><p id="fecha" class="mb-3">-</p>
        <p class="mb-1"><b>Estado de la firma</b></p><p id="estado" class="mb-3"><span class="badge bg-secondary">Comprobando…</span></p>
        <p class="mb-1"><b>Hash SHA-256</b></p><p id="hash" class="small text-break font-monospace">-</p>
        <p class="mb-1"><b>Enlace de verificación</b></p>
        <p class="small text-break"><a id="enlace" href="#">-</a></p>
        <div class="d-grid gap-2">
          <button class="btn btn-primary" onclick="descargar()">Descargar PDF</button>
          <button class="btn btn-outline-secondary" onclick="copiar()">Copiar enlace</button>
          <a id="verificar" class="btn btn-success" href="#">Ir al portal de verificación</a>
        </div>
      </div></div></div>
    </div>
  </div>
  <script src="js/api.js"></script><script src="js/menu.js"></script>
  <script>
    cargarMenu("roadmaps.html");
    const id = new URLSearchParams(location.search).get("id");
    const urlVer = location.origin + "/verificar.html?id=" + id;
    let blobUrl = null;
    function error(m) { aviso.textContent = m; aviso.classList.remove("d-none"); }
    async function cargar() {
      if (!id) return error("Falta el identificador del roadmap.");
      try {
        const r = await fetch(API + "/roadmaps/" + id + "/pdf", { headers: { Authorization: "Bearer " + token() } });
        if (r.status === 401) { sessionStorage.clear(); location.href = "login.html"; return; }
        if (!r.ok) throw new Error("No se encontró el documento.");
        blobUrl = URL.createObjectURL(await r.blob());
        visor.src = blobUrl;
        const meta = (await api("/roadmaps")).find(x => String(x.id) === id);
        if (meta) { fecha.textContent = meta.fecha; hash.textContent = meta.hash; }
        enlace.textContent = enlace.href = verificar.href = urlVer;
        try {
          const v = await fetch(API + "/verificar/" + id).then(x => x.json());
          estado.innerHTML = v.resultado === "auténtico"
            ? '<span class="badge bg-success">Firma válida</span>' : '<span class="badge bg-danger">Documento alterado</span>';
        } catch (e) { estado.innerHTML = '<span class="badge bg-secondary">Sin comprobar</span>'; }
      } catch (e) { error(e.message); }
    }
    function descargar() { const a = document.createElement("a"); a.href = blobUrl; a.download = "roadmap_" + id + ".pdf"; a.click(); }
    function copiar() { navigator.clipboard.writeText(urlVer); }
    cargar();
  </script>
</body>
</html>
