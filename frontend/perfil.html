<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil - Roadmap Académico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>
  <div class="container py-4">
    <div id="aviso" class="alert d-none"></div>
    <div class="card shadow-sm mb-4"><div class="card-body">
      <h5>Datos personales</h5>
      <div class="row g-2">
        <div class="col-md-3"><label class="form-label">Código</label><input id="codigo" class="form-control" disabled></div>
        <div class="col-md-5"><label class="form-label">Nombres</label><input id="nombres" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Correo</label><input id="correo" type="email" class="form-control"></div>
      </div>
      <button class="btn btn-primary mt-3" onclick="guardarPerfil()">Guardar</button>
    </div></div>

    <div class="card shadow-sm"><div class="card-body">
      <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
        <h5 class="mb-0">Historial académico</h5>
        <div class="d-flex gap-2">
          <select id="filtro" class="form-select form-select-sm" onchange="pintar()">
            <option value="">Todos</option><option value="1">Aprobados</option><option value="0">Desaprobados</option>
          </select>
          <button class="btn btn-success btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#modalCurso">Agregar curso</button>
        </div>
      </div>
      <div class="table-responsive"><table class="table table-sm table-striped">
        <thead><tr><th>Curso</th><th>Nota</th><th>Periodo</th><th>Estado</th></tr></thead>
        <tbody id="tabla"></tbody>
      </table></div>
    </div></div>
  </div>

  <div class="modal fade" id="modalCurso" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Agregar curso</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input id="mCurso" class="form-control mb-2" placeholder="Código del curso (ej. CS101)">
      <input id="mNota" type="number" min="0" max="20" step="0.5" class="form-control mb-2" placeholder="Nota (0-20)">
      <input id="mPeriodo" class="form-control" placeholder="Periodo (ej. 2025-I)">
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="agregarCurso()">Guardar curso</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script><script src="js/menu.js"></script>
  <script>
    cargarMenu("perfil.html");
    let historial = [];
    function aviso(msg, ok) { const a = document.getElementById("aviso"); a.textContent = msg;
      a.className = "alert " + (ok ? "alert-success" : "alert-danger"); }
    async function cargar() {
      try {
        const p = await api("/perfil");
        codigo.value = p.codigo || ""; nombres.value = p.nombres; correo.value = p.correo;
        historial = await api("/historial"); pintar();
      } catch (e) { aviso(e.message, false); }
    }
    function pintar() {
      const f = filtro.value;
      tabla.innerHTML = historial.filter(h => f === "" || String(h.aprobado ? 1 : 0) === f).map(h =>
        "<tr><td>" + h.codigo_curso + "</td><td>" + h.nota + "</td><td>" + h.periodo + "</td><td>" +
        (h.aprobado ? '<span class="badge bg-success">Aprobado</span>' : '<span class="badge bg-danger">Desaprobado</span>') +
        "</td></tr>").join("") || '<tr><td colspan="4" class="text-center text-muted">Sin cursos registrados</td></tr>';
    }
    async function guardarPerfil() {
      try { await api("/perfil", { method: "PUT", body: { nombres: nombres.value, correo: correo.value } });
        aviso("Perfil guardado", true); } catch (e) { aviso(e.message, false); }
    }
    async function agregarCurso() {
      try {
        await api("/historial", { method: "POST", body: { codigo_curso: mCurso.value, nota: parseFloat(mNota.value), periodo: mPeriodo.value } });
        bootstrap.Modal.getInstance(document.getElementById("modalCurso")).hide();
        mCurso.value = mNota.value = mPeriodo.value = "";
        historial = await api("/historial"); pintar(); aviso("Curso agregado", true);
      } catch (e) { aviso(e.message, false); }
    }
    cargar();
  </script>
</body>
</html>
