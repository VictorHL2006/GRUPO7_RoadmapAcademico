<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de tutor · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container py-4"><h1 class="h3">Panel de tutor</h1><div id="aviso" class="alert alert-danger d-none"></div><div class="row g-2 my-3"><div class="col-md-7"><label class="form-label" for="buscar">Buscar por código o nombre</label><input id="buscar" class="form-control"></div><div class="col-md-5"><label class="form-label" for="especialidad">Filtrar por especialidad</label><select id="especialidad" class="form-select"><option value="">Todas</option></select></div></div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Código</th><th>Estudiante</th><th>Especialidad</th><th>Roadmaps</th><th></th></tr></thead><tbody id="tabla"></tbody></table></div><section id="detalle" class="card d-none"><div class="card-body"><h2 class="h5">Roadmaps del estudiante</h2><ul id="lista"></ul></div></section></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>
cargarMenu('tutor.html');let filas=[];const notice=document.getElementById('aviso'),table=document.getElementById('tabla'),filter=document.getElementById('especialidad');function fail(e){notice.textContent=e.message;notice.classList.remove('d-none')}function draw(){const q=document.getElementById('buscar').value.trim().toLowerCase();const selected=filter.value;const found=filas.filter(f=>(!q||(f.codigo||'').toLowerCase().includes(q)||(f.nombres||'').toLowerCase().includes(q))&&(!selected||f.especialidad===selected));table.replaceChildren();for(const f of found){const tr=document.createElement('tr');for(const v of [f.codigo||'—',f.nombres,f.especialidad||'Sin roadmaps',f.cantidad_roadmaps]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');if(f.cantidad_roadmaps){const b=document.createElement('button');b.className='btn btn-sm btn-outline-primary';b.textContent='Ver roadmaps';b.onclick=()=>see(f);td.append(b)}tr.append(td);table.append(tr)}if(!found.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='No hay estudiantes que coincidan';tr.append(td);table.append(tr)}}async function see(f){try{const list=await api('/tutor/estudiantes/'+encodeURIComponent(f.codigo)+'/roadmaps');const host=document.getElementById('lista');host.replaceChildren();for(const r of list){const li=document.createElement('li');li.textContent=new Date(r.emitido).toLocaleDateString('es-PE')+' · '+(r.especialidad||'')+' · ';const a=document.createElement('a');a.href='verificar.html?id='+encodeURIComponent(r.id);a.textContent='Verificar';li.append(a);host.append(li)}document.getElementById('detalle').classList.remove('d-none')}catch(e){fail(e)}}document.getElementById('buscar').addEventListener('input',draw);filter.addEventListener('change',draw);api('/tutor/estudiantes').then(data=>{filas=data;for(const e of [...new Set(data.map(x=>x.especialidad).filter(Boolean))].sort())filter.add(new Option(e,e));draw()}).catch(fail)
</script></body></html>
