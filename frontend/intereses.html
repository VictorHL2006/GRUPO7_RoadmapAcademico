<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intereses · Roadmap Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head><body class="bg-light"><div id="menu"></div><main class="container py-4"><div id="aviso" class="alert d-none"></div><section class="card shadow-sm"><div class="card-body"><h1 class="h4">Áreas de interés profesional</h1><p>Selecciona las áreas que orientarán la especialidad recomendada.</p><div id="checkbox-areas" class="row g-2"></div><button id="guardar" class="btn btn-primary mt-3">Guardar intereses</button> <a href="generar.html" class="btn btn-outline-primary mt-3">Continuar a generar roadmap</a></div></section></main><script src="js/api.js"></script><script src="js/menu.js"></script><script>
cargarMenu('intereses.html');const opciones=[['desarrollo','Desarrollo'],['calidad','Calidad'],['web','Web'],['seguridad','Seguridad'],['redes','Redes'],['criptografía','Criptografía'],['datos','Datos'],['estadística','Estadística'],['ia','Inteligencia Artificial (IA)']];const host=document.getElementById('checkbox-areas');host.innerHTML=opciones.map(([v,t],i)=>'<div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" value="'+v+'" id="i'+i+'"><label class="form-check-label" for="i'+i+'">'+t+'</label></div></div>').join('');api('/intereses').then(r=>{const selected=new Set(r.intereses);host.querySelectorAll('input').forEach(x=>x.checked=selected.has(x.value))}).catch(showError);function showError(e){const a=document.getElementById('aviso');a.textContent=e.message;a.className='alert alert-danger'}document.getElementById('guardar').addEventListener('click',async()=>{try{const selected=[...host.querySelectorAll('input:checked')].map(x=>x.value);await api('/intereses',{method:'PUT',body:{intereses:selected}});const a=document.getElementById('aviso');a.textContent='Intereses guardados';a.className='alert alert-success'}catch(e){showError(e)}})
</script></body></html>
